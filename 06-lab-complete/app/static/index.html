
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ lý Học tập</title>
    <style>
        /* CSS Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Main Container */
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Header */
        .chat-header {
            background-color: #1e1e1e;
            padding: 12px 20px;
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .rules-reminder {
            font-size: 12px;
            color: #888;
            margin-left: auto;
        }

        /* Messages Container */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* Message */
        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        /* Avatar */
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            flex-shrink: 0;
        }

        .avatar.assistant {
            background-color: #10a37f;
            color: white;
        }

        .avatar.user {
            background-color: #2d2d2d;
            color: white;
        }

        /* Message Content */
        .message-content {
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
        }

        .message.user .message-content {
            background-color: #2d2d2d;
        }

        .message.assistant .message-content {
            background-color: #1e1e1e;
        }

        /* Input Area */
        .input-container {
            background-color: #1e1e1e;
            border-top: 1px solid #2d2d2d;
            padding: 16px 20px;
            display: flex;
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .input-area {
            flex: 1;
            background-color: #2d2d2d;
            border: 1px solid #3d3d3d;
            border-radius: 12px;
            padding: 12px 16px;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 16px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-area:focus {
            border-color: #10a37f;
        }

        .send-btn {
            background-color: #10a37f;
            color: white;
            border: none;
            border-radius: 10px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .send-btn:hover {
            background-color: #0d8a6a;
        }

        .send-btn:disabled {
            background-color: #3d3d3d;
            cursor: not-allowed;
        }

        /* Sidebar */
        .sidebar {
            width: 400px;
            background-color: #1e1e1e;
            border-left: 1px solid #2d2d2d;
            display: flex;
            flex-direction: column;
            transition: width 0.3s;
        }

        .sidebar.collapsed {
            width: 50px;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #2d2d2d;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-toggle {
            background: none;
            border: none;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 20px;
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 600;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .sidebar.collapsed .sidebar-content,
        .sidebar.collapsed .sidebar-title {
            display: none;
        }

        /* Log Items */
        .log-item {
            border-bottom: 1px solid #2d2d2d;
            padding: 12px 0;
        }

        .log-step {
            font-size: 12px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
        }

        .log-thought, .log-action, .log-observation {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .log-action {
            color: #10a37f;
        }

        .log-observation {
            color: #888;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Chat Container -->
        <div class="chat-container">
            <!-- Header -->
        <div class="chat-header">
            <h1>🧠 Trợ lý Học tập</h1>
            <div style="display: flex; align-items: center; gap: 12px;">
                <select id="model-selector" style="background: #333; color: white; border: 1px solid #444; border-radius: 6px; padding: 6px 12px; font-size: 14px;">
                    <option value="mock">Mock ReAct</option>
                    <option value="openai">OpenAI</option>
                    <option value="google">Google Gemini</option>
                    <option value="local">Local Phi-3</option>
                    <option value="deepseek">DeepSeek</option>
                    <option value="qwen">Local Qwen</option>
                </select>
                <span class="rules-reminder">Chỉ trả lời về điểm số & học tập</span>
            </div>
        </div>
            <!-- Messages -->
            <div class="messages-container" id="messagesContainer">
                <div class="message assistant">
                    <div class="avatar assistant">AI</div>
                    <div class="message-content">
                        Xin chào! Tôi có thể giúp bạn tìm hiểu về điểm số học sinh. Vui lòng hỏi về điểm hoặc thông tin học tập!
                    </div>
                </div>
            </div>
            <!-- Input -->
            <div class="input-container">
                <textarea class="input-area" id="messageInput" placeholder="Nhập câu hỏi của bạn..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
            </div>
        </div>
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
                <span class="sidebar-title">📋 Logs</span>
            </div>
            <div class="sidebar-content" id="logsContent">
                <p style="color:#888; font-size:14px;">Logs sẽ hiện ở đây...</p>
            </div>
        </div>
    </div>

    <script>
        // Session State
        let sessionId = localStorage.getItem('sessionId') || null;
        let isLoading = false;

        // Toggle Sidebar
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
        }

        // Render Message
        function addMessage(content, isUser) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;
            messageDiv.innerHTML = `
                <div class="avatar ${isUser ? 'user' : 'assistant'}">
                    ${isUser ? 'B' : 'AI'}
                </div>
                <div class="message-content">
                    ${content}
                </div>
            `;
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        // Render Logs
        function addLogs(steps) {
            const logsContent = document.getElementById('logsContent');
            logsContent.innerHTML = '';
            steps.forEach((step, i) => {
                const logDiv = document.createElement('div');
                logDiv.className = 'log-item';
                logDiv.innerHTML = `
                    <div class="log-step">Bước ${i + 1}</div>
                    ${step.thought ? `<div class="log-thought">💡 ${step.thought}</div>` : ''}
                    ${step.action ? `<div class="log-action">⚙️ ${step.action}</div>` : ''}
                    ${step.observation ? `<div class="log-observation">📄 ${step.observation}</div>` : ''}
                `;
                logsContent.appendChild(logDiv);
            });
        }

        // Send Message
        async function sendMessage() {
            if (isLoading) return;
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            // Add user message
            addMessage(message, true);
            input.value = '';
            input.style.height = 'auto';

            isLoading = true;
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            
            const provider = document.getElementById('model-selector').value;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: message,
                        provider: provider,
                        max_steps: 5,
                        session_id: sessionId
                    }),
                });

                if (!response.ok) {
                    throw new Error('Server error');
                }

                const data = await response.json();
                sessionId = data.session_id || sessionId;
                if (sessionId) {
                    localStorage.setItem('sessionId', sessionId);
                }

                // Add assistant message
                addMessage(data.response, false);

                // Add logs
                if (data.steps && data.steps.length > 0) {
                    addLogs(data.steps);
                }

            } catch (err) {
                addMessage('Đã xảy ra lỗi, vui lòng thử lại!', false);
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
            }
        }

        // Auto-resize textarea
        const input = document.getElementById('messageInput');
        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 200) + 'px';
        });

        // Enter to send
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
